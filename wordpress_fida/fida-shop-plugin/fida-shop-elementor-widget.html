<!--
  FIDA SHOP – Elementor HTML Widget (wersja dynamiczna)
  Wklej w: Elementor → HTML Widget
  Wymaga aktywnego WooCommerce (data-wp-* używa @wordpress/interactivity ładowanego przez WC)
  Wymaga aktywnego snippetu Code Snippets "FIDA Shop Shortcode" (patrz fida-shop-shortcode.php).

  Użycie:
  1. Usuń istniejący WC Product Collection block ze strony Sklep
  2. Dodaj widget "HTML" w Elementorze w tym samym miejscu
  3. Wklej całość tego pliku
  4. Sekcja Elementora: Layout → Content Width = Full Width

  Co się zmieniło względem wersji statycznej:
  - 7 zhardocodowanych <li> z produktami zastąpione jednym [fida_shop]
  - Statyczny "<p>7 produkty</p>" zastąpiony dynamicznym [fida_shop_count]
  - Reszta (CSS, klasy, ribbon, przyciski) bez zmian
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Alata&family=Rubik:wght@300;400&display=swap');

.fida-shop {
  max-width: 1224px;
  width: 100%;
  margin: 0 auto;
  padding: 100px 16px;
  background: #fff;
  font-family: 'Rubik', sans-serif;
  color: rgb(26, 26, 26);
  box-sizing: border-box;
  overflow: hidden;
}
.fida-shop *, .fida-shop *::before, .fida-shop *::after { box-sizing: border-box; }

/* Toolbar: H3 + ilość */
.fida-shop-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin: 0 0 32px;
}
.fida-shop-heading {
  font-family: 'Alata', 'Times New Roman', sans-serif;
  font-size: 32px;
  font-weight: 400;
  line-height: 1.3;
  margin: 0;
  color: rgb(26, 26, 26);
  word-break: normal;
}
.fida-shop-count {
  font-family: 'Rubik', sans-serif;
  font-size: 14px;
  font-weight: 400;
  margin: 0;
  color: rgb(26, 26, 26);
}

/* Siatka 4 kolumny */
.fida-shop .wc-block-product-template {
  display: grid !important;
  grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
  gap: 43px 23px !important;
  list-style: none !important;
  padding: 0 !important;
  margin: 0 !important;
}

/* Karta */
.fida-shop .wc-block-product {
  background: #fff !important;
  border: 1px solid #dadce0 !important;
  border-radius: 0 !important;
  transition: border-color .2s ease !important;
  overflow: hidden !important;
  display: flex !important;
  flex-direction: column !important;
  float: none !important;
  clear: none !important;
  width: auto !important;
  margin: 0 !important;
  padding: 0 !important;
  min-width: 0 !important;
}
.fida-shop .wc-block-product.first,
.fida-shop .wc-block-product.last {
  width: auto !important;
  margin: 0 !important;
  float: none !important;
}
.fida-shop .wc-block-product:hover { border-color: rgb(26, 26, 26) !important; }

/* Obrazek: aspect ratio 4:5, cover, zoom na hover */
.fida-shop .wc-block-components-product-image {
  position: relative !important;
  aspect-ratio: 1024 / 1280 !important;
  overflow: hidden !important;
  background: #fff !important;
  margin: 0 !important;
  padding: 0 !important;
  line-height: 0 !important;
}
.fida-shop .wc-block-components-product-image__inner-container { display: none !important; }
.fida-shop .wc-block-components-product-image > a {
  display: block !important;
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  line-height: 0 !important;
  text-decoration: none !important;
}
.fida-shop .wc-block-components-product-image img {
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  object-fit: cover !important;
  transition: transform .4s ease !important;
  display: block !important;
}
.fida-shop .wc-block-product:hover .wc-block-components-product-image img { transform: scale(1.04) !important; }

/* Ribbon "Nowość" */
.fida-shop .wc-block-components-product-image::before {
  content: "Nowość";
  position: absolute;
  top: 12px;
  left: 0;
  z-index: 3;
  background: rgb(29, 30, 32);
  color: #fff;
  font-family: 'Rubik', sans-serif;
  font-size: 12px;
  font-weight: 400;
  padding: 4px 10px;
  letter-spacing: .03em;
  line-height: 1.2;
}

/* Tytuł: Alata, 14px, nie łamie słów */
.fida-shop .wc-block-product .wp-block-post-title,
.fida-shop .wc-block-product h2.wp-block-post-title,
.fida-shop .wc-block-product .wp-block-post-title.has-medium-font-size,
.fida-shop .wc-block-product .wp-block-post-title a {
  font-family: 'Alata', 'Times New Roman', sans-serif !important;
  font-size: 14px !important;
  font-weight: 400 !important;
  line-height: 1.3 !important;
  margin: 0 !important;
  padding: 16px 16px 8px !important;
  color: rgb(26, 26, 26) !important;
  text-align: left !important;
  word-break: normal !important;
  overflow-wrap: break-word !important;
  hyphens: none !important;
  -webkit-hyphens: none !important;
  text-decoration: none !important;
  letter-spacing: 0 !important;
  text-transform: none !important;
}

/* Cena: 99.00zł */
.fida-shop .wc-block-product .wp-block-woocommerce-product-price {
  padding: 0 16px 8px !important;
  text-align: left !important;
  font-size: 14px !important;
  margin: 0 !important;
  line-height: 1.5 !important;
}
.fida-shop .wc-block-product .wc-block-components-product-price,
.fida-shop .wc-block-product .woocommerce-Price-amount,
.fida-shop .wc-block-product .woocommerce-Price-amount bdi {
  font-family: 'Rubik', sans-serif !important;
  font-size: 14px !important;
  font-weight: 400 !important;
  color: rgb(26, 26, 26) !important;
  text-align: left !important;
  line-height: 1.5 !important;
}
.fida-shop .wc-block-product .woocommerce-Price-amount bdi {
  display: inline-flex !important;
  flex-direction: row-reverse !important;
  align-items: baseline !important;
}
.fida-shop .wc-block-product .woocommerce-Price-currencySymbol {
  margin: 0 !important;
  font-weight: 400 !important;
}

/* Przycisk: 12px font, 10px padding, nie łamie */
.fida-shop .wc-block-product .wp-block-woocommerce-product-button {
  padding: 0 16px 16px !important;
  text-align: left !important;
  margin: 0 !important;
  display: block !important;
  margin-top: auto !important;
}
.fida-shop .wc-block-product .wc-block-components-product-button { display: block !important; width: 100% !important; }
.fida-shop .wc-block-product .wc-block-components-product-button__button,
.fida-shop .wc-block-product a.wc-block-components-product-button__button,
.fida-shop .wc-block-product button.wc-block-components-product-button__button {
  display: block !important;
  width: 100% !important;
  box-sizing: border-box !important;
  padding: 10px 6px !important;
  font-family: 'Rubik', sans-serif !important;
  font-size: 12px !important;
  font-weight: 400 !important;
  line-height: normal !important;
  color: #000 !important;
  background: transparent !important;
  background-color: transparent !important;
  border: 1px solid #000 !important;
  border-radius: 0 !important;
  text-align: center !important;
  text-decoration: none !important;
  letter-spacing: 0 !important;
  text-transform: none !important;
  transition: background .2s ease, color .2s ease, border-color .2s ease !important;
  cursor: pointer !important;
  margin: 0 !important;
  min-height: auto !important;
  height: auto !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}
.fida-shop .wc-block-product .wc-block-components-product-button__button:hover,
.fida-shop .wc-block-product a.wc-block-components-product-button__button:hover,
.fida-shop .wc-block-product button.wc-block-components-product-button__button:hover {
  background: rgb(29, 30, 32) !important;
  background-color: rgb(29, 30, 32) !important;
  color: #fff !important;
  border-color: rgb(29, 30, 32) !important;
}
.fida-shop .added_to_cart {
  display: inline-block;
  margin-top: 6px;
  font-size: 12px;
  color: #000;
}

/* Notices (górny komunikat WC) – schowany, psuje layout */
.fida-shop .wc-block-components-notices { display: none !important; }

/* Mobile */
@media (max-width: 960px) {
  .fida-shop { padding: 56px 16px !important; }
  .fida-shop .wc-block-product-template {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 24px 16px !important;
  }
  .fida-shop-toolbar { width: 100%; flex-direction: column; align-items: flex-start; gap: 8px; }
  .fida-shop-count { width: 100%; }
  .fida-shop-heading { font-size: 26px !important; }
}
@media (max-width: 480px) {
  .fida-shop-heading { font-size: 22px !important; }
  .fida-shop .wc-block-product .wc-block-components-product-button__button {
    padding: 9px 4px !important;
    font-size: 11px !important;
  }
  .fida-shop .wc-block-product .wp-block-post-title { font-size: 12px !important; }
}
</style>

<div class="fida-shop">

  <div class="fida-shop-toolbar">
    <h3 class="fida-shop-heading">Wszystkie produkty</h3>
    [fida_shop_count]
  </div>

  [fida_shop]

</div>

<script>
(function(){
  // Klik w obrazek lub tytuł – nawigacja do produktu (backup dla viewProduct action)
  document.querySelectorAll('.fida-shop .wc-block-product').forEach(function(card){
    var link = card.querySelector('.wc-block-components-product-image a');
    if (link) {
      link.addEventListener('click', function(e){
        // Pozwól WC interactivity działać, tylko nawiguj jeśli nic innego
        if (!e.defaultPrevented) {
          window.location.href = link.href;
        }
      });
    }
  });
})();
</script>
